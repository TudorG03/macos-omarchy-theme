name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq
      - name: Run ShellCheck
        run: shellcheck -S warning install.sh uninstall.sh hooks/cupertino tests/check.sh
      - name: Run repo checks
        run: tests/check.sh
